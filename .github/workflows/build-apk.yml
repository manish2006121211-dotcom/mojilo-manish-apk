name: Build Mojilo Manish APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      # IMPORTANT: No npm cache here because the project ZIP
      # has not been extracted yet.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Find and extract ZIP
      - name: Find and extract ZIP
        run: |
          set -e

          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d project
          else
            echo "ERROR: ZIP file not found."
            exit 1
          fi

      # 4. Find actual project folder
      - name: Find project folder
        run: |
          set -e

          if [ -f project/package.json ]; then
            echo "package.json found in project/"
          else
            FOUND=$(find project -name package.json -type f | head -n 1)

            if [ -z "$FOUND" ]; then
              echo "ERROR: package.json not found."

              echo "Files inside project:"
              find project -maxdepth 4 -type f | head -100

              exit 1
            fi

            DIR=$(dirname "$FOUND")

            echo "Actual project found at: $DIR"

            if [ "$DIR" != "project" ]; then
              shopt -s dotglob
              cp -r "$DIR"/* project/
            fi
          fi

          echo "Project folder ready."

      # 5. Show project
      - name: Show project
        working-directory: project
        run: |
          echo "=============================="
          echo "PROJECT FILES"
          echo "=============================="

          ls -la

          echo "=============================="
          echo "PACKAGE.JSON"
          echo "=============================="

          cat package.json

      # 6. Install dependencies
      - name: Install dependencies
        working-directory: project
        run: |
          set -e

          if [ -f package-lock.json ]; then
            echo "package-lock.json found."
            npm ci
          else
            echo "No package-lock.json found."
            npm install
          fi

      # 7. Install Firebase
      - name: Install Firebase
        working-directory: project
        run: |
          npm install firebase

      # 8. Install Capacitor
      - name: Install Capacitor
        working-directory: project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # 9. Create Firebase fallback configuration
      - name: Create Firebase configuration
        working-directory: project
        run: |
          if [ ! -f firebase-applet-config.json ]; then

            cat > firebase-applet-config.json <<'EOF'
          {
            "apiKey": "",
            "authDomain": "",
            "projectId": "",
            "storageBucket": "",
            "messagingSenderId": "",
            "appId": ""
          }
          EOF

            echo "Firebase fallback configuration created."

          else
            echo "Existing Firebase configuration found."
            echo "Keeping existing configuration."
          fi

      # 10. Install Pillow
      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Pillow

      # 11. Create required application images
      - name: Fix missing application images
        run: |
          set -e

          mkdir -p project/src/assets/images

          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os

          size = 1024

          img = Image.new(
              "RGB",
              (size, size),
              "#2563EB"
          )

          draw = ImageDraw.Draw(img)

          margin = 100

          draw.rounded_rectangle(
              (
                  margin,
                  margin,
                  size - margin,
                  size - margin
              ),
              radius=180,
              fill="white"
          )

          font = None

          font_paths = [
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"
          ]

          for path in font_paths:
              if os.path.exists(path):
                  font = ImageFont.truetype(path, 400)
                  break

          if font is None:
              font = ImageFont.load_default()

          text = "M"

          bbox = draw.textbbox(
              (0, 0),
              text,
              font=font
          )

          text_width = bbox[2] - bbox[0]
          text_height = bbox[3] - bbox[1]

          x = (size - text_width) // 2
          y = (size - text_height) // 2 - 30

          draw.text(
              (x, y),
              text,
              fill="#2563EB",
              font=font
          )

          img.save(
              "project/src/assets/images/icon.png",
              "PNG"
          )

          img.save(
              "project/src/assets/images/app_icon_1786271094033.jpg",
              "JPEG",
              quality=95
          )

          print("Application images created successfully.")
          PY

          ls -lh project/src/assets/images/

      # 12. Verify image
      - name: Verify required image
        run: |
          set -e

          test -f project/src/assets/images/icon.png
          test -f project/src/assets/images/app_icon_1786271094033.jpg

          echo "Required images found."

      # 13. Build web app
      - name: Build web app
        working-directory: project
        run: |
          set -e

          echo "=============================="
          echo "BUILDING WEB APP"
          echo "=============================="

          npm run build

          echo "Web build successful."

      # 14. Setup Capacitor configuration
      - name: Setup Capacitor
        working-directory: project
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then

            cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.mojilomanish.app',
            appName: 'Mojilo Manish',
            webDir: 'dist',
            bundledWebRuntime: false
          };

          export default config;
          EOF

            echo "Capacitor configuration created."

          else
            echo "Existing Capacitor configuration found."
          fi

      # 15. Add Android platform
      - name: Add Android platform
        working-directory: project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android platform already exists."
          fi

      # 16. Sync Capacitor
      - name: Sync Capacitor
        working-directory: project
        run: |
          npx cap sync android

      # 17. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 18. Check Java
      - name: Check Java
        run: |
          java -version
          javac -version

      # 19. Setup Android SDK
      - name: Setup Android SDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 20. Configure Android SDK
      - name: Configure Android SDK
        working-directory: project/android
        run: |
          set +e

          find . -name "*.gradle" -type f -exec sed -i \
            -e 's/compileSdkVersion[[:space:]]*=[[:space:]]*[0-9]*/compileSdkVersion = 35/g' \
            -e 's/compileSdkVersion[[:space:]]*[0-9]*/compileSdkVersion 35/g' \
            -e 's/targetSdkVersion[[:space:]]*=[[:space:]]*[0-9]*/targetSdkVersion = 35/g' \
            -e 's/targetSdkVersion[[:space:]]*[0-9]*/targetSdkVersion 35/g' \
            {} +

          echo "Android SDK 35 configured."

      # 21. Fix Kotlin duplicate classes
      - name: Fix Kotlin duplicate classes
        working-directory: project/android
        run: |
          set -e

          cat >> build.gradle <<'EOF'

          allprojects {
              configurations.configureEach {

                  resolutionStrategy {

                      force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                      force "org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22"
                      force "org.jetbrains.kotlin:kotlin-reflect:1.8.22"

                      eachDependency { details ->

                          if (details.requested.group == "org.jetbrains.kotlin") {

                              if (details.requested.name == "kotlin-stdlib-jdk7") {
                                  details.useVersion "1.8.22"
                              }

                              if (details.requested.name == "kotlin-stdlib-jdk8") {
                                  details.useVersion "1.8.22"
                              }

                          }
                      }
                  }

                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
              }
          }

          EOF

          echo "Kotlin duplicate dependency fix applied."

      # 22. Make Gradle executable
      - name: Make Gradle executable
        working-directory: project/android
        run: |
          chmod +x gradlew

      # 23. Clean Gradle
      - name: Clean Gradle
        working-directory: project/android
        run: |
          ./gradlew clean --no-daemon

      # 24. Build Debug APK
      - name: Build Debug APK
        working-directory: project/android
        run: |
          set -e

          echo "======================================"
          echo "BUILDING MOJILO MANISH APK"
          echo "======================================"

          ./gradlew assembleDebug --no-daemon --stacktrace

      # 25. Check APK
      - name: Check APK
        run: |
          set -e

          APK="project/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "======================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$APK"

      # 26. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mojilo-Manish-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 27. Build complete
      - name: Build complete
        run: |
          echo "======================================"
          echo "MOJILO MANISH APK BUILD SUCCESSFUL"
          echo "======================================"
          echo "APK is ready for download."
