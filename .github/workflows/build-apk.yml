name: Build Mojilo Manish APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ''

      # 3. Find and extract ZIP
      - name: Find and extract ZIP
        run: |
          set -e

          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found:"
            echo "$ZIP_FILE"

            unzip -o "$ZIP_FILE" -d project

            echo "ZIP extracted."
          else
            echo "No ZIP found."
          fi

      # 4. Find actual project folder
      - name: Find project folder
        run: |
          set -e

          echo "Searching for package.json..."

          FOUND=$(find project -type f -name "package.json" | head -n 1)

          if [ -z "$FOUND" ]; then
            echo "ERROR: package.json not found."
            find project -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$FOUND")

          echo "Found project:"
          echo "$PROJECT_DIR"

          if [ "$PROJECT_DIR" != "project" ]; then
            mkdir -p project-temp

            cp -r "$PROJECT_DIR"/. project-temp/

            rm -rf project/*

            cp -r project-temp/. project/

            rm -rf project-temp
          fi

          echo "Final project:"
          ls -la project

      # 5. Show project
      - name: Show project
        working-directory: project
        run: |
          echo "===== PROJECT FILES ====="
          find . -maxdepth 3 -type f | sort | head -200

          echo ""
          echo "===== PACKAGE.JSON ====="
          cat package.json

      # 6. Install dependencies
      - name: Install dependencies
        working-directory: project
        run: |
          set -e

          rm -rf node_modules

          if [ -f package-lock.json ]; then
            echo "Installing using npm install..."
            npm install
          else
            echo "No package-lock.json found."
            npm install
          fi

      # 7. Install Firebase
      - name: Install Firebase
        working-directory: project
        run: |
          npm install firebase --save

      # 8. Install Capacitor
      - name: Install Capacitor
        working-directory: project
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 --save

      # 9. Create Capacitor config if missing
      - name: Create Capacitor configuration
        working-directory: project
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then

            cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.mojilomanish.app',
            appName: 'Mojilo Manish',
            webDir: 'dist',
            bundledWebRuntime: false
          };

          export default config;
          EOF

            echo "Capacitor configuration created."

          else
            echo "Existing Capacitor configuration found."
          fi

      # 10. Create required app images
      - name: Fix missing application images
        run: |
          set -e

          mkdir -p project/src/assets/images

          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os

          size = 1024

          img = Image.new(
              "RGB",
              (size, size),
              "#2563EB"
          )

          draw = ImageDraw.Draw(img)

          margin = 100

          draw.rounded_rectangle(
              (
                  margin,
                  margin,
                  size - margin,
                  size - margin
              ),
              radius=180,
              fill="white"
          )

          font_paths = [
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"
          ]

          font = None

          for path in font_paths:
              if os.path.exists(path):
                  font = ImageFont.truetype(path, 400)
                  break

          if font is None:
              font = ImageFont.load_default()

          text = "M"

          bbox = draw.textbbox(
              (0, 0),
              text,
              font=font
          )

          width = bbox[2] - bbox[0]
          height = bbox[3] - bbox[1]

          x = (size - width) // 2
          y = (size - height) // 2 - 30

          draw.text(
              (x, y),
              text,
              fill="#2563EB",
              font=font
          )

          img.save(
              "project/src/assets/images/icon.png",
              "PNG"
          )

          img.save(
              "project/src/assets/images/app_icon_1786271094033.jpg",
              "JPEG",
              quality=95
          )

          print("Application images created.")
          PY

          ls -lh project/src/assets/images/

      # 11. Install Pillow
      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Pillow

      # 12. Fix logo image reference
      - name: Fix logo image reference
        working-directory: project
        run: |
          set -e

          if [ -f src/assets/logo.ts ]; then

            echo "logo.ts found."

            sed -i \
              "s#app_icon_[0-9]*\.jpg#app_icon_1786271094033.jpg#g" \
              src/assets/logo.ts

            echo "logo.ts updated."

            cat src/assets/logo.ts

          else
            echo "logo.ts not found. No change needed."
          fi

      # 13. Verify important files
      - name: Verify project
        working-directory: project
        run: |
          set -e

          test -f package.json

          test -f src/assets/images/app_icon_1786271094033.jpg

          echo "package.json OK"
          echo "Application image OK"

      # 14. Build web app
      - name: Build web app
        working-directory: project
        run: |
          set -e

          echo "Starting web build..."

          npm run build

          echo "Web build successful."

          if [ -d dist ]; then
            echo "dist folder found."
            find dist -maxdepth 2 -type f | head -50
          else
            echo "ERROR: dist folder not found."
            exit 1
          fi

      # 15. Setup Capacitor
      - name: Setup Capacitor
        working-directory: project
        run: |
          set -e

          npx cap --version

      # 16. Add Android platform
      - name: Add Android platform
        working-directory: project
        run: |
          set -e

          if [ ! -d android ]; then
            echo "Adding Android platform..."
            npx cap add android
          else
            echo "Android platform already exists."
          fi

      # 17. Sync Capacitor
      - name: Sync Capacitor
        working-directory: project
        run: |
          set -e

          npx cap sync android

      # 18. Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 19. Check Java
      - name: Check Java
        run: |
          java -version
          javac -version

      # 20. Setup Android SDK
      - name: Setup Android SDK
        run: |
          set -e

          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK 35 installed."

      # 21. Configure Android SDK safely
      - name: Configure Android SDK
        working-directory: project/android
        run: |
          set -e

          echo "Checking Gradle files..."

          grep -R "compileSdkVersion" -n . --include="*.gradle" --include="*.gradle.kts" || true

          grep -R "targetSdkVersion" -n . --include="*.gradle" --include="*.gradle.kts" || true

          echo "Gradle configuration checked."

      # 22. Make Gradle executable
      - name: Make Gradle executable
        working-directory: project/android
        run: |
          chmod +x gradlew

      # 23. Clean Gradle
      - name: Clean Gradle
        working-directory: project/android
        run: |
          ./gradlew clean --no-daemon

      # 24. Check Android dependencies
      - name: Check Android dependencies
        working-directory: project/android
        run: |
          ./gradlew dependencies --no-daemon > dependencies.txt || true

          echo "Android dependencies checked."

      # 25. Build Debug APK
      - name: Build Debug APK
        working-directory: project/android
        run: |
          set -e

          echo "======================================"
          echo "BUILDING MOJILO MANISH APK"
          echo "======================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # 26. Check APK
      - name: Check APK
        run: |
          set -e

          APK="project/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found."
            find project/android -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK FOUND:"
          ls -lh "$APK"

      # 27. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mojilo-Manish-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 28. Build complete
      - name: Build complete
        run: |
          echo "======================================"
          echo "MOJILO MANISH APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh project/android/app/build/outputs/apk/debug/app-debug.apk
