name: Build Mojilo Manish APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Find and extract ZIP
      - name: Find and extract ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "ZIP extracted successfully."

      # 4. Find package.json
      - name: Find project folder
        shell: bash
        run: |
          set -e

          if [ -f "project/package.json" ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
            exit 0
          fi

          PACKAGE_FILE=$(find project -type f -name "package.json" | head -n 1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          PACKAGE_DIR=$(dirname "$PACKAGE_FILE")

          echo "PROJECT_DIR=$PACKAGE_DIR" >> "$GITHUB_ENV"

      # 5. Show project files
      - name: Show project
        run: |
          echo "Project directory:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo "Project files:"
          find . -maxdepth 3 -type f | head -200

      # 6. Install dependencies
      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # 7. Install Capacitor
      - name: Install Capacitor
        run: |
          cd "$PROJECT_DIR"

          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      # 8. Fix missing application image
      - name: Fix missing application image
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Searching for application images..."

          mkdir -p images
          mkdir -p public/images
          mkdir -p src/assets

          TARGET="app_icon_1786271094033.jpg"

          # Search for an existing JPG image
          IMAGE=$(find . \
            -type f \
            \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) \
            ! -path "./node_modules/*" \
            ! -path "./android/*" \
            | head -n 1)

          if [ -n "$IMAGE" ]; then
            echo "Found image: $IMAGE"

            cp "$IMAGE" "images/$TARGET"
            cp "$IMAGE" "public/images/$TARGET"
            cp "$IMAGE" "src/assets/$TARGET"

          else
            echo "No image found."

            # Create a tiny valid JPG as fallback
            python3 - <<'PY'
          import base64

          data = base64.b64decode(
              ""
          )

          for path in [
              "images/app_icon_1786271094033.jpg",
              "public/images/app_icon_1786271094033.jpg",
              "src/assets/app_icon_1786271094033.jpg"
          ]:
              with open(path, "wb") as f:
                  f.write(data)

          print("Fallback image created.")
          PY
          fi

          echo "Application image fix completed."

      # 9. Build web application
      - name: Build web app
        run: |
          cd "$PROJECT_DIR"

          echo "Starting web build..."

          npm run build

      # 10. Add Android
      - name: Add Android platform
        run: |
          cd "$PROJECT_DIR"

          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android folder already exists."
          fi

      # 11. Sync Capacitor
      - name: Sync Capacitor
        run: |
          cd "$PROJECT_DIR"

          npx cap sync android

      # 12. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 13. Setup Android
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 14. Install Android SDK
      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 15. Make Gradle executable
      - name: Make Gradle executable
        run: |
          chmod +x "$PROJECT_DIR/android/gradlew"

      # 16. Build APK
      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR/android"

          ./gradlew assembleDebug

      # 17. Prepare APK
      - name: Copy APK
        run: |
          mkdir -p apk

          cp "$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk" \
             "apk/Mojilo-Manish.apk"

          ls -lh apk/Mojilo-Manish.apk

      # 18. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mojilo-Manish-APK
          path: apk/Mojilo-Manish.apk
          if-no-files-found: error
