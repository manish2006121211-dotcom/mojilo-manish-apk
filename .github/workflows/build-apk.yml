name: Build Mojilo Manish APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. NODE.JS
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # =========================================================
      # 3. FIND AND EXTRACT ZIP
      # =========================================================
      - name: Find and extract ZIP
        run: |
          set -e

          rm -rf project
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP FOUND:"
            echo "$ZIP_FILE"

            unzip -o "$ZIP_FILE" -d project

            echo "ZIP extracted successfully."
          else
            echo "No ZIP file found."

            cp -r . project/
          fi


      # =========================================================
      # 4. FIND ACTUAL WEB PROJECT
      # =========================================================
      - name: Find project folder
        run: |
          set -e

          echo "Searching for package.json..."

          FOUND=$(find project -type f -name "package.json" | head -n 1)

          if [ -z "$FOUND" ]; then
            echo "ERROR: package.json NOT FOUND."
            find project -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$FOUND")

          echo "Project found at:"
          echo "$PROJECT_DIR"

          if [ "$PROJECT_DIR" != "project" ]; then

            mkdir -p project-temp

            cp -r "$PROJECT_DIR"/. project-temp/

            rm -rf project/*

            cp -r project-temp/. project/

            rm -rf project-temp

          fi

          echo "Final project folder:"
          ls -la project


      # =========================================================
      # 5. SHOW PROJECT
      # =========================================================
      - name: Show project
        working-directory: project
        run: |
          echo "=============================="
          echo "PROJECT FILES"
          echo "=============================="

          find . -maxdepth 3 -type f | sort | head -200

          echo ""
          echo "=============================="
          echo "PACKAGE.JSON"
          echo "=============================="

          cat package.json


      # =========================================================
      # 6. INSTALL NPM DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        working-directory: project
        run: |
          set -e

          rm -rf node_modules

          npm install

          echo "Dependencies installed successfully."


      # =========================================================
      # 7. INSTALL FIREBASE
      # =========================================================
      - name: Install Firebase
        working-directory: project
        run: |
          set -e

          npm install firebase --save

          echo "Firebase installed successfully."


      # =========================================================
      # 8. INSTALL CAPACITOR
      # =========================================================
      - name: Install Capacitor
        working-directory: project
        run: |
          set -e

          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 --save

          echo "Capacitor installed successfully."


      # =========================================================
      # 9. CREATE CAPACITOR CONFIG ONLY IF MISSING
      # =========================================================
      - name: Create Capacitor configuration
        working-directory: project
        run: |
          set -e

          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then

            cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.mojilomanish.app',
            appName: 'Mojilo Manish',
            webDir: 'dist'
          };

          export default config;
          EOF

            echo "Capacitor configuration created."

          else

            echo "Existing Capacitor configuration found."

          fi


      # =========================================================
      # 10. INSTALL PILLOW
      # IMPORTANT: THIS MUST COME BEFORE IMAGE CREATION
      # =========================================================
      - name: Install Pillow
        run: |
          set -e

          python3 -m pip install --upgrade pip
          python3 -m pip install Pillow

          python3 -c "from PIL import Image; print('Pillow is working correctly.')"


      # =========================================================
      # 11. CREATE APP IMAGES
      # =========================================================
      - name: Fix missing application images
        run: |
          set -e

          mkdir -p project/src/assets/images

          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os

          print("Creating Mojilo Manish application images...")

          size = 1024

          # Background
          img = Image.new(
              "RGB",
              (size, size),
              "#2563EB"
          )

          draw = ImageDraw.Draw(img)

          # White rounded square
          margin = 100

          draw.rounded_rectangle(
              (
                  margin,
                  margin,
                  size - margin,
                  size - margin
              ),
              radius=180,
              fill="white"
          )

          # Find font
          font_paths = [
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"
          ]

          font = None

          for path in font_paths:

              if os.path.exists(path):

                  font = ImageFont.truetype(
                      path,
                      400
                  )

                  break

          if font is None:
              font = ImageFont.load_default()

          # Letter M
          text = "M"

          bbox = draw.textbbox(
              (0, 0),
              text,
              font=font
          )

          text_width = bbox[2] - bbox[0]
          text_height = bbox[3] - bbox[1]

          x = (size - text_width) // 2
          y = (size - text_height) // 2 - 30

          draw.text(
              (x, y),
              text,
              fill="#2563EB",
              font=font
          )

          # PNG
          img.save(
              "project/src/assets/images/icon.png",
              "PNG"
          )

          # Required JPG
          img.save(
              "project/src/assets/images/app_icon_1786271094033.jpg",
              "JPEG",
              quality=95
          )

          print("Images created successfully.")

          PY

          echo ""
          echo "Created images:"
          ls -lh project/src/assets/images/


      # =========================================================
      # 12. FIX LOGO IMAGE REFERENCE
      # =========================================================
      - name: Fix logo image reference
        working-directory: project
        run: |
          set -e

          if [ -f src/assets/logo.ts ]; then

            echo "logo.ts found."

            sed -i \
              's/app_icon_[0-9]*\.jpg/app_icon_1786271094033.jpg/g' \
              src/assets/logo.ts

            echo "logo.ts after fix:"
            cat src/assets/logo.ts

          else

            echo "logo.ts not found."
            echo "No logo.ts modification required."

          fi


      # =========================================================
      # 13. VERIFY IMPORTANT FILES
      # =========================================================
      - name: Verify project
        working-directory: project
        run: |
          set -e

          echo "Checking package.json..."

          test -f package.json

          echo "Checking application image..."

          test -f src/assets/images/app_icon_1786271094033.jpg

          echo "Checking PNG..."

          test -f src/assets/images/icon.png

          echo ""
          echo "ALL IMPORTANT FILES ARE OK."


      # =========================================================
      # 14. BUILD WEB APP
      # =========================================================
      - name: Build web app
        working-directory: project
        run: |
          set -e

          echo "=============================="
          echo "BUILDING WEB APP"
          echo "=============================="

          npm run build

          echo ""
          echo "Web build completed."

          if [ ! -d dist ]; then
            echo "ERROR: dist folder was not created."
            exit 1
          fi

          echo ""
          echo "DIST FILES:"
          find dist -maxdepth 2 -type f | head -100


      # =========================================================
      # 15. CHECK CAPACITOR
      # =========================================================
      - name: Setup Capacitor
        working-directory: project
        run: |
          set -e

          npx cap --version


      # =========================================================
      # 16. ADD ANDROID
      # =========================================================
      - name: Add Android platform
        working-directory: project
        run: |
          set -e

          if [ ! -d android ]; then

            echo "Adding Android platform..."

            npx cap add android

          else

            echo "Android platform already exists."

          fi


      # =========================================================
      # 17. SYNC CAPACITOR
      # =========================================================
      - name: Sync Capacitor
        working-directory: project
        run: |
          set -e

          npx cap sync android

          echo "Capacitor sync completed."


      # =========================================================
      # 18. JAVA 21
      # =========================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # =========================================================
      # 19. CHECK JAVA
      # =========================================================
      - name: Check Java
        run: |
          java -version
          javac -version


      # =========================================================
      # 20. ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        run: |
          set -e

          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK 35 installed."


      # =========================================================
      # 21. DO NOT MODIFY variables.gradle
      # This avoids:
      # compileSdkVersion 35 = 35
      # =========================================================
      - name: Verify Android Gradle configuration
        working-directory: project/android
        run: |
          set -e

          echo "Checking Android Gradle configuration..."

          if [ -f variables.gradle ]; then

            echo ""
            echo "variables.gradle:"
            cat variables.gradle

          fi

          echo ""
          echo "Checking compile SDK references..."

          grep -R "compileSdk" -n . \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            || true

          echo ""
          echo "Checking target SDK references..."

          grep -R "targetSdk" -n . \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            || true


      # =========================================================
      # 22. MAKE GRADLE EXECUTABLE
      # =========================================================
      - name: Make Gradle executable
        working-directory: project/android
        run: |
          chmod +x gradlew


      # =========================================================
      # 23. CLEAN GRADLE
      # =========================================================
      - name: Clean Gradle
        working-directory: project/android
        run: |
          ./gradlew clean --no-daemon


      # =========================================================
      # 24. BUILD DEBUG APK
      # =========================================================
      - name: Build Debug APK
        working-directory: project/android
        run: |
          set -e

          echo "======================================"
          echo "BUILDING MOJILO MANISH APK"
          echo "======================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

          echo "Gradle build completed."


      # =========================================================
      # 25. CHECK APK
      # =========================================================
      - name: Check APK
        run: |
          set -e

          APK="project/android/app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK..."

          if [ ! -f "$APK" ]; then

            echo "ERROR: APK NOT FOUND."

            echo ""
            echo "Searching for APK files..."

            find project/android \
              -type f \
              -name "*.apk" \
              -print

            exit 1

          fi

          echo ""
          echo "======================================"
          echo "APK FOUND"
          echo "======================================"

          ls -lh "$APK"


      # =========================================================
      # 26. UPLOAD APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mojilo-Manish-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


      # =========================================================
      # 27. SUCCESS
      # =========================================================
      - name: Build complete
        run: |
          echo ""
          echo "======================================"
          echo "MOJILO MANISH APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh \
            project/android/app/build/outputs/apk/debug/app-debug.apk
