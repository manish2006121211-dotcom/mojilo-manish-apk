name: Build Mojilo Manish APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Find and extract ZIP
      - name: Find and extract ZIP
        run: |
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d project
          else
            echo "No ZIP found. Using repository files."
            cp -r . project/
          fi

      # 4. Find actual project folder
      - name: Find project folder
        run: |
          echo "Searching for package.json..."

          PROJECT_DIR=$(find project -type f -name "package.json" \
            -not -path "*/node_modules/*" \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json not found"
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project found at: $PROJECT_DIR"

      # 5. Show project
      - name: Show project
        run: |
          cd "$PROJECT_DIR"
          echo "Project files:"
          find . -maxdepth 3 -type f | sort | head -200

      # 6. Install dependencies
      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      # 7. Install Capacitor
      - name: Install Capacitor
        run: |
          cd "$PROJECT_DIR"
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # 8. FIX MISSING APPLICATION IMAGE
      - name: Fix missing application image
        run: |
          cd "$PROJECT_DIR"

          mkdir -p src/assets/images

          IMAGE="src/assets/images/app_icon_1786271094033.jpg"

          if [ ! -f "$IMAGE" ]; then
            echo "Missing image detected."
            echo "Creating placeholder JPG..."

            echo '' \
              | base64 -d > "$IMAGE"

            echo "Placeholder image created."
          else
            echo "Image already exists."
          fi

      # 9. Build web app
      - name: Build web app
        run: |
          cd "$PROJECT_DIR"
          npm run build

      # 10. Add Android platform
      - name: Add Android platform
        run: |
          cd "$PROJECT_DIR"

          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # 11. Sync Capacitor
      - name: Sync Capacitor
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      # 12. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 13. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 14. Install Android SDK
      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # 15. Make Gradle executable
      - name: Make Gradle executable
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew

      # 16. Build Debug APK
      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR/android"
          ./gradlew assembleDebug

      # 17. Copy APK
      - name: Copy APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk"

          cp "$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk" \
             "$GITHUB_WORKSPACE/apk/Mojilo-Manish.apk"

      # 18. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mojilo-Manish-APK
          path: apk/Mojilo-Manish.apk
