name: Build Mojilo Manish APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. FIND AND EXTRACT ZIP
      # =========================================================
      - name: Find and extract ZIP
        run: |
          set -e

          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d project
          else
            echo "No ZIP found."
            cp -r . project/
          fi


      # =========================================================
      # 3. FIND REAL PROJECT FOLDER
      # =========================================================
      - name: Find project folder
        run: |
          set -e

          cd project

          if [ -f package.json ]; then
            echo "Project found in root."
          else
            FOUND=$(find . -type f -name package.json | head -n 1)

            if [ -z "$FOUND" ]; then
              echo "ERROR: package.json not found."
              exit 1
            fi

            DIR=$(dirname "$FOUND")

            echo "Project found in: $DIR"

            if [ "$DIR" != "." ]; then
              cp -r "$DIR"/* .
              cp -r "$DIR"/.[!.]* . 2>/dev/null || true
            fi
          fi

          echo "================================"
          echo "PROJECT FILES"
          echo "================================"

          ls -la

          echo "================================"
          echo "PACKAGE.JSON"
          echo "================================"

          cat package.json


      # =========================================================
      # 4. SETUP NODE
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: project/package-lock.json


      # =========================================================
      # 5. CHECK NODE
      # =========================================================
      - name: Check Node and npm
        run: |
          node --version
          npm --version


      # =========================================================
      # 6. INSTALL DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        working-directory: project
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi


      # =========================================================
      # 7. INSTALL FIREBASE
      # =========================================================
      - name: Install Firebase
        working-directory: project
        run: |
          npm install firebase


      # =========================================================
      # 8. INSTALL CAPACITOR
      # =========================================================
      - name: Install Capacitor
        working-directory: project
        run: |
          npm install @capacitor/core
          npm install @capacitor/cli
          npm install @capacitor/android


      # =========================================================
      # 9. CREATE FIREBASE CONFIG
      # =========================================================
      - name: Create Firebase configuration
        working-directory: project
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          set -e

          cat > firebase-applet-config.json <<EOF
          {
            "apiKey": "${FIREBASE_API_KEY}",
            "authDomain": "${FIREBASE_AUTH_DOMAIN}",
            "projectId": "${FIREBASE_PROJECT_ID}",
            "storageBucket": "${FIREBASE_STORAGE_BUCKET}",
            "messagingSenderId": "${FIREBASE_MESSAGING_SENDER_ID}",
            "appId": "${FIREBASE_APP_ID}"
          }
          EOF

          echo "Firebase configuration created."

          echo "Firebase project:"
          if [ -n "$FIREBASE_PROJECT_ID" ]; then
            echo "Firebase Project ID is present."
          else
            echo "WARNING: Firebase Project ID is empty."
          fi


      # =========================================================
      # 10. INSTALL PILLOW
      # =========================================================
      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Pillow


      # =========================================================
      # 11. FIX APP ICON / LOGO
      # =========================================================
      - name: Fix missing app images
        run: |
          set -e

          mkdir -p project/src/assets/images
          mkdir -p project/src/assets

          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os

          size = 1024

          img = Image.new(
              "RGB",
              (size, size),
              "#2563EB"
          )

          draw = ImageDraw.Draw(img)

          margin = 100

          draw.rounded_rectangle(
              (
                  margin,
                  margin,
                  size - margin,
                  size - margin
              ),
              radius=180,
              fill="white"
          )

          font_paths = [
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"
          ]

          font = None

          for path in font_paths:
              if os.path.exists(path):
                  font = ImageFont.truetype(path, 400)
                  break

          if font is None:
              font = ImageFont.load_default()

          text = "M"

          bbox = draw.textbbox(
              (0, 0),
              text,
              font=font
          )

          text_width = bbox[2] - bbox[0]
          text_height = bbox[3] - bbox[1]

          x = (size - text_width) // 2
          y = (size - text_height) // 2 - 30

          draw.text(
              (x, y),
              text,
              fill="#2563EB",
              font=font
          )

          img.save(
              "project/src/assets/images/icon.png",
              "PNG"
          )

          img.save(
              "project/src/assets/images/app_icon_1786271094033.jpg",
              "JPEG",
              quality=95
          )

          # Also create common possible logo names
          img.save(
              "project/src/assets/logo.png",
              "PNG"
          )

          print("All required app images created.")
          PY

          echo "Images:"
          find project/src -type f | grep -E '\.(png|jpg|jpeg)$' || true


      # =========================================================
      # 12. FIX REFERENCED IMAGE PATH
      # =========================================================
      - name: Fix logo image reference
        working-directory: project
        run: |
          set -e

          mkdir -p src/assets

          cp src/assets/images/app_icon_1786271094033.jpg \
             src/assets/app_icon_1786271094033.jpg

          echo "Logo image copied to:"
          ls -lh src/assets/app_icon_1786271094033.jpg


      # =========================================================
      # 13. VERIFY IMPORTANT FILES
      # =========================================================
      - name: Verify project
        working-directory: project
        run: |
          set -e

          test -f package.json
          test -f firebase-applet-config.json
          test -f src/assets/app_icon_1786271094033.jpg

          echo "================================"
          echo "IMPORTANT FILES VERIFIED"
          echo "================================"

          ls -lh package.json
          ls -lh firebase-applet-config.json
          ls -lh src/assets/app_icon_1786271094033.jpg


      # =========================================================
      # 14. BUILD WEB APP
      # =========================================================
      - name: Build web app
        working-directory: project
        run: |
          set -e

          echo "Starting web build..."

          npm run build

          echo "================================"
          echo "WEB BUILD SUCCESS"
          echo "================================"

          if [ -d dist ]; then
            echo "dist folder found."
            ls -la dist
          elif [ -d build ]; then
            echo "build folder found."
            ls -la build
          else
            echo "WARNING: dist/build folder not found."
          fi


      # =========================================================
      # 15. SETUP CAPACITOR
      # =========================================================
      - name: Setup Capacitor
        working-directory: project
        run: |
          set -e

          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then

            cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.mojilomanish.app',
            appName: 'Mojilo Manish',
            webDir: 'dist',
            bundledWebRuntime: false
          };

          export default config;
          EOF

          fi

          echo "Capacitor configuration ready."


      # =========================================================
      # 16. ADD ANDROID
      # =========================================================
      - name: Add Android platform
        working-directory: project
        run: |
          set -e

          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android platform already exists."
          fi


      # =========================================================
      # 17. SYNC CAPACITOR
      # =========================================================
      - name: Sync Capacitor
        working-directory: project
        run: |
          set -e

          npx cap sync android


      # =========================================================
      # 18. SETUP JAVA
      # =========================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # =========================================================
      # 19. CHECK JAVA
      # =========================================================
      - name: Check Java
        run: |
          java -version
          javac -version


      # =========================================================
      # 20. SETUP ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # =========================================================
      # 21. SET COMPILE SDK
      # =========================================================
      - name: Configure Android SDK
        working-directory: project/android
        run: |
          set -e

          find . -name "*.gradle" -type f -exec sed -i \
            -e 's/compileSdkVersion[[:space:]]*=[[:space:]]*34/compileSdkVersion = 35/g' \
            -e 's/compileSdkVersion[[:space:]]*34/compileSdkVersion 35/g' \
            -e 's/targetSdkVersion[[:space:]]*=[[:space:]]*34/targetSdkVersion = 35/g' \
            -e 's/targetSdkVersion[[:space:]]*34/targetSdkVersion 35/g' \
            {} +


      # =========================================================
      # 22. MAKE GRADLE EXECUTABLE
      # =========================================================
      - name: Make Gradle executable
        working-directory: project/android
        run: |
          chmod +x gradlew


      # =========================================================
      # 23. CLEAN GRADLE
      # =========================================================
      - name: Clean Gradle
        working-directory: project/android
        run: |
          ./gradlew clean --no-daemon


      # =========================================================
      # 24. BUILD DEBUG APK
      # =========================================================
      - name: Build Debug APK
        working-directory: project/android
        run: |
          set -e

          ./gradlew assembleDebug --no-daemon

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"


      # =========================================================
      # 25. CHECK APK
      # =========================================================
      - name: Check APK
        run: |
          set -e

          APK="project/android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK FOUND:"
          ls -lh "$APK"


      # =========================================================
      # 26. UPLOAD APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mojilo-Manish-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


      # =========================================================
      # 27. SUCCESS MESSAGE
      # =========================================================
      - name: Build complete
        run: |
          echo ""
          echo "======================================"
          echo " MOJILO MANISH APK READY"
          echo "======================================"
          echo ""
          echo "Download artifact:"
          echo "Mojilo-Manish-APK"
          echo ""
          echo "======================================"
